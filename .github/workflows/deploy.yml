

name: Publier Mes Souvenirs TV

on:

  push:

    branches:

      - main

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Recuperer les fichiers

        uses: actions/checkout@v4

      - name: Configurer Pages

        uses: actions/configure-pages@v5

      - name: Preparer le site

        uses: actions/upload-pages-artifact@v4

        with:

          path: .

      - name: Publier

        id: deployment

        uses: actions/deploy-pages@v4
